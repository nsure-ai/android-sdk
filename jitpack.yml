dependencies:
  - group: com.android.volley
    artifact: volley
    version: 1.2.1
  - group: io.jsonwebtoken
    artifact: jjwt-api
    version: 0.10.7
  - group: io.jsonwebtoken
    artifact: jjwt-orgjson
    version: 0.10.7
    exclusions:
      - group: org.json
        artifact: json
  - group: com.google.code.gson
    artifact: gson
    version: 2.10.1
  - group: androidx.appcompat
    artifact: appcompat
    version: 1.7.0
  - group: com.fingerprint.android
    artifact: pro
    version: 2.8.0
install:
  - mvn install:install-file -Dfile=nsure.aar -DgroupId=com.nsure -DartifactId=nsure -Dversion=$VERSION -Dpackaging=aar
